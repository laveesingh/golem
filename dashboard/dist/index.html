<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark light"/>
  <title>Golem · Dashboard</title>
  <script>
    // Apply the saved appearance before CSS is requested so reloads never
    // flash. Nocturne & Inkstone is the default when the preference is
    // missing or not recognized; an explicit 'dark' choice is honored.
    (() => {
      try {
        const theme = localStorage.getItem('golem.tweaks.theme');
        const applied = ['dark', 'loam', 'graphite', 'nocturne'].includes(theme) ? theme : 'nocturne';
        if (applied !== 'dark') document.documentElement.dataset.theme = applied;
      } catch { document.documentElement.dataset.theme = 'nocturne'; }
    })();
  </script>

</head>

</body>
