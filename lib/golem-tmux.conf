# Golem-owned tmux server configuration.
# Keep the worker namespace separate from the user's normal tmux server.
set-option -g prefix C-g
unbind-key C-b
bind-key C-g send-prefix

# ── Scrollback ──
set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
# Pi workers run fullscreen TUI (user tuiMode=fullscreen): let them own the
# alternate screen and route mouse-wheel to the app there — that is Pi's own
# transcript scroller (wheel / PgUp / Ctrl+Up·Down prompt jumps / Ctrl+Shift+F
# search). Shell panes (alternate_on=0) keep tmux copy-mode scrollback.
# (The previous `alternate-screen off` forced inline painting and smeared
# fullscreen repaint frames into copy-mode — garbage scrollback.)
bind-key -T root WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "send-keys -M"
# Pi asks for this so modified keys (Shift+Enter etc.) reach it intact
set -g extended-keys on
# Copy-mode scrollbar for shell panes
set -g pane-scrollbars on

# ── Tree / preview (choose-tree) ──
# tmux 3.7 has no tree-mode-preview-size option; size is controlled only by -N flag:
#   choose-tree          → default 50% preview
#   choose-tree -N       → no preview
#   choose-tree -NN      → large preview (~70%)
# Cursor in preview follows the pane's cursor; scroll preview with < / > in tree mode.
set -g tree-mode-preview-format "#{?pane_format,#{pane_index}:#{pane_title},#{window_index}:#{window_name}}"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{display-panes-active-colour},#{display-panes-colour}}"
# Default bindings keep preview; add large-preview variants on Ctrl-
bind-key s choose-tree -Zs
bind-key S choose-tree -Zs -N
bind-key C-s choose-tree -Zs -NN
bind-key w choose-tree -Zw
bind-key W choose-tree -Zw -N
bind-key C-w choose-tree -Zw -NN

# ── Session tabs (vim-like) ──
# Tabs are full session switches (not previews). Active tab high-contrast, all tabs clickable.
# Uses native S: loop — no shell, no deadlock, range tags make clicks switch.
set -g status on
set -g status-interval 2
set -g status-left-length 150
set -g status-style bg=green,fg=black
# Inactive: black on green, Active: yellow bg black bold — readable, clickable via range
set -g status-left "#{S:#[range=session|#{session_id}]#[fg=black] #{session_name} #[norange],#[range=session|#{session_id}]#[bg=yellow,fg=black,bold] #{session_name} #[norange]} "
set -g status-justify left
set -g status-right "\"#{=21:pane_title}\" %H:%M %d-%b-%y"
# vim-like tab switching: prefix Tab / S-Tab cycles, Alt-Tab quick flip (like gt/gT)
bind-key Tab switch-client -n
bind-key BTab switch-client -p
bind-key -n M-Tab switch-client -n
bind-key -n M-BTab switch-client -p
